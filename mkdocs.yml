site_name: ROBOT.md Docs
site_url: https://docs.robotmd.dev
site_description: ROBOT.md specification, MCP integration, compliance.
site_author: Craig Merry
repo_name: craigm26/robot-md-docs
repo_url: https://github.com/craigm26/robot-md-docs
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Spec:
    - Overview: spec/index.md
    - v1 (current): spec/v1.md
    - v0.2 design: spec/v0.2-design.md
    - v0.1 MCP design: spec/v0.1-mcp-design.md
  - MCP: mcp/index.md
  - Compliance: compliance/index.md
  - Examples:
    - Overview: examples/index.md
    - bob: examples/bob.md
    - minimal: examples/minimal.md
    - so-arm101: examples/so-arm101.md
    - turtlebot4: examples/turtlebot4.md
